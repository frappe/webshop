<div class="d-flex justify-content-between mb-2">
    <span class="text-muted small">{{ _("Subtotal") }}</span>
    <span class="font-weight-bold">{{ doc.get_formatted("net_total") }}</span>
</div>
{% for tax in doc.taxes %}
<div class="d-flex justify-content-between mb-2">
    <span class="text-muted small">{{ tax.description }}</span>
    <span class="font-weight-bold">{{ tax.get_formatted("tax_amount") }}</span>
</div>
{% endfor %}
<div class="d-flex justify-content-between mt-4 pt-4 border-top-light">
    <span class="font-weight-bold h5">{{ _("Total Amount") }}</span>
    <span class="font-weight-bold h5 text-primary">{{ doc.get_formatted("grand_total") }}</span>
</div>
