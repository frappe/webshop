name: CI

on:
  pull_request:
    paths-ignore:
      - "**.css"
      - "**.js"
      - "**.md"
      - "**.html"
      - "**.csv"
  schedule:
    # Run everday at midnight UTC / 5:30 IST
    - cron: "0 0 * * *"
  workflow_dispatch:

concurrency:
  group: develop-webshop-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    name: Server

    # Pilot runs with --ci, so it provisions no database server of its own;
    # the bench points at this container instead.
    services:
      mariadb:
        image: mariadb:11.8
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: --health-cmd="mariadb-admin ping" --health-interval=5s --health-timeout=2s --health-retries=3

    steps:
      - name: Clone
        uses: actions/checkout@v7

      - name: Find tests
        run: |
          echo "Finding tests"
          grep -rn "def test" > /dev/null

      - name: Resolve target branch
        id: branch
        run: |
          branch="${{ github.base_ref || github.ref_name }}"
          if ! git ls-remote --exit-code --heads https://github.com/frappe/frappe.git "$branch" >/dev/null 2>&1; then
            branch="develop"
          fi
          echo "target=$branch" >> "$GITHUB_OUTPUT"
          echo "Resolved target branch: $branch"

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          check-latest: true

      - name: Cache pip and uv
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.cache/uv
          key: ${{ runner.os }}-pip-${{ hashFiles('**/*requirements.txt', '**/pyproject.toml', '**/setup.py', '**/setup.cfg') }}
          restore-keys: |
            ${{ runner.os }}-pip-
            ${{ runner.os }}-

      - name: Setup Pilot
        run: |
          curl -fsSL https://raw.githubusercontent.com/frappe/pilot/develop/install.sh | sh -s -- --ci
          export PATH="$HOME/pilot/bin:$HOME/.local/bin:$PATH"
          printf '%s\n' "$HOME/pilot/bin" "$HOME/.local/bin" >> "$GITHUB_PATH"
          pilot new frappe-bench --frappe-branch "${{ steps.branch.outputs.target }}"
          pilot -b frappe-bench set-bench-config admin_allow_site_to_pilot_communication false
          pilot -b frappe-bench set-bench-config mariadb_existing true
          pilot -b frappe-bench set-bench-config mariadb_host 127.0.0.1
          pilot -b frappe-bench set-bench-config mariadb_port 3306
          pilot -b frappe-bench set-bench-config mariadb_admin_user root
          pilot -b frappe-bench set-bench-config mariadb_password root
          pilot -b frappe-bench init --skip-frontend
          # The external MariaDB service has no utf8mb4 defaults; Frappe needs them.
          printf '[client]\nskip-ssl\n' > ~/.my.cnf
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL character_set_server = 'utf8mb4'"
          mariadb --host 127.0.0.1 --port 3306 -u root -proot -e "SET GLOBAL collation_server = 'utf8mb4_unicode_ci'"

      - name: Install Apps
        working-directory: /home/runner/pilot/benches/frappe-bench
        run: |
          uv pip install --python env/bin/python -e "apps/frappe[test]"
          pilot get-app https://github.com/frappe/payments --branch "${{ steps.branch.outputs.target }}" --skip-assets
          pilot get-app https://github.com/frappe/erpnext --branch "${{ steps.branch.outputs.target }}" --skip-assets
          pilot get-app "$GITHUB_WORKSPACE" --branch "$GITHUB_SHA" --skip-assets
        env:
          CI: 'Yes'

      - name: Start Pilot
        run: |
          pilot -b frappe-bench start > "$RUNNER_TEMP/pilot.log" 2>&1 &
          curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 \
            http://127.0.0.1:7000/api/v1/health

      - name: Create Test Site
        working-directory: /home/runner/pilot/benches/frappe-bench
        run: |
          pilot new-site test_site --admin-password admin --apps frappe payments erpnext webshop --skip-assets
          mkdir -p sites/assets
          [ -f sites/assets/assets.json ] || echo '{}' > sites/assets/assets.json

      - name: Run Tests
        working-directory: /home/runner/pilot/benches/frappe-bench
        run: |
          pilot frappe --site test_site set-config allow_tests true
          pilot frappe --site test_site run-tests --app webshop
        env:
          TYPE: server

      - name: Show Pilot logs on failure
        if: failure()
        run: cat "$RUNNER_TEMP/pilot.log" || true
